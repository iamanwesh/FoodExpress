<app-search></app-search>
<app-tag></app-tag>
<app-not-found [visible]="!foods || !foods.length"
Resetlinktext="Reset Search"></app-not-found>
<ul class="container-fluid">
    <li *ngFor="let food of foods">
      <a routerLink="/food/{{food.id}}">
        <img [src]="food.imageurl" [alt]="food.name" />
        <div class="content">
          <div class="name">
            {{food.name}}
          </div>
          <span class="favorite {{food.favorite?'':'not'}}">
            ❤
          </span>
          <div class="stars">
            <app-starrating [stars]="food.star"></app-starrating>
          </div>
          <div class="product-item-footer">
            <div class="origins">
              <span *ngFor="let origin of food.origins">
                {{origin}}
              </span>
            </div>
            <div class="cook-time">
              <span>🕒</span>
              {{food.cooktime}}
            </div>
          </div>
          <div class="price">
            <span>
              {{food.price | currency:"&#8377;"}}
            </span>
          </div>
        </div>
      </a>
    </li>
  </ul>
