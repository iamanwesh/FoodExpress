<app-title title="Cart Page" margin="1.5rem 0 0 2.5rem"></app-title>
<app-not-found
[visible]="!cart || !cart.items.length"
notfoundmessage="Cart Is Empty"
Resetlinktext="Go To The Home Page"
></app-not-found>
<div *ngIf="cart && cart.items.length" class="container">
    <ul>
        <li *ngFor="let cartitem of cart.items">
            <div>
                <img [src]="cartitem.food.imageurl" [alt]="cartitem.food.name">
            </div>
            <div>
                <a routerLink="/food/{{cartitem.food.id}}">
                    {{cartitem.food.name}}
                </a>
            </div>
            <div>
                <select #quantityselect [value]="cartitem.quantity"
                    (change)="changequantity(cartitem,quantityselect.value)">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>
            <div>
                {{cartitem.price | currency:'&#8377;'}}
            </div>
            <div>
                <button class="remove-button" (click)="removefromcart(cartitem)">
                    Remove
                </button>
            </div>
        </li>
    </ul>
    <div class="checkout">
        <div>
            <div class="food-count">
                {{cart.totalcount}}
            </div>
            <div class="total-price">
                {{cart.totalprice|currency:"&#8377;"}}
            </div>
        </div>
        <a routerLink="/checkout">proceed to checkout</a>
    </div>
</div>
